        - heading "Solve real problems. Stay friendly while doing it." [level=2] [ref=e94]: Solve real problems.Stay friendly while doing it.
        - paragraph [ref=e95]: Most software today either ignores how regular people actually live, or talks down to them while pretending to help. We think there's a better way.
        - paragraph [ref=e96]: AmigoLabs builds the tools we wished existed for our families, friends and neighbours — practical software that solves a real, daily problem and feels like a helpful friend, not a complicated app.
