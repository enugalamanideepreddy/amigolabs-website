<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpaceOS">
  <defs>
    <linearGradient id="occuBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="55%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="occuShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="occuSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Rounded square frame -->
  <rect width="128" height="128" rx="30" ry="30" fill="url(#occuBg)"/>
  <rect width="128" height="128" rx="30" ry="30" fill="url(#occuShine)"/>

  <!-- House / hub silhouette -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M30 60 L64 30 L98 60 L98 96 Q98 100 94 100 L34 100 Q30 100 30 96 Z"/>
  </g>

  <!-- Door / occupancy dot (the "hub") -->
  <circle cx="64" cy="76" r="11" fill="#FFFFFF"/>
  <circle cx="64" cy="76" r="4.5" fill="#0D9488"/>

  <!-- Subtle ground line under the house -->
  <line x1="38" y1="100" x2="90" y2="100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
</svg>
